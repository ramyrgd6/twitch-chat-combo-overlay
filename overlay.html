<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch Chat Combo Overlay</title>
  <style>
    :root {
      /* Customize your overlay's palette and layout here. */
      --accent: #ffd23f;
      --accent-hot: #ff4d6d;
      --count-color: #45f28c;
      --ink: #10111a;
      --panel: rgba(10, 14, 25, .76);
      --panel-edge: rgba(255, 255, 255, .34);
      --font: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      --message-size: clamp(68px, 9vw, 168px);
      --count-size: clamp(48px, 5.6vw, 96px);
      --bottom-offset: 7vh;
    }
    :root[data-theme="sakura"] {
      --accent: #ff82bd; --accent-hot: #ff3b8d; --panel: rgba(49, 13, 43, .73); --panel-edge: rgba(255, 208, 236, .5); --ink: #250d24;
    }
    :root[data-theme="rainfall"] {
      --accent: #92d9ff; --accent-hot: #568cff; --panel: rgba(10, 23, 45, .78); --panel-edge: rgba(196, 231, 255, .52); --ink: #071426;
    }
    :root[data-theme="inferno"] {
      --accent: #ff9a34; --accent-hot: #ff304f; --panel: rgba(54, 13, 12, .77); --panel-edge: rgba(255, 211, 135, .5); --ink: #250809;
    }
    :root[data-theme="luna"] {
      --accent: #d9dcff; --accent-hot: #ae8cff; --panel: rgba(17, 19, 51, .76); --panel-edge: rgba(230, 234, 255, .5); --ink: #0c0d28;
    }
    :root[data-theme="blizzard"] {
      --accent: #e7f8ff; --accent-hot: #78ccff; --panel: rgba(14, 52, 80, .8); --panel-edge: rgba(228, 249, 255, .72); --ink: #061e34;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    /* The source now sits in the true center of the OBS canvas. */
    body { display: grid; place-items: center; padding: 0 4vw; }

    #combo {
      --power: 1;
      --combo-color: var(--accent);
      position: relative;
      display: grid;
      justify-items: center;
      max-width: 92vw;
      isolation: isolate;
      opacity: 0;
      transform: translateY(22px) scale(.82);
      filter: drop-shadow(0 13px 0 rgba(0, 0, 0, .45));
      pointer-events: none;
      will-change: transform, translate, opacity, filter;
    }
    #combo.visible { opacity: 1; }
    #combo.slam { animation: slam 520ms cubic-bezier(.12,.82,.16,1.04) both; }
    #combo.slam::before { animation: flash 250ms ease-out both; }
    #combo.shake { animation-name: slam, shake; animation-duration: 520ms, 420ms; animation-timing-function: cubic-bezier(.12,.82,.16,1.04), ease-in-out; }
    #combo.hiding { animation: exit 1050ms cubic-bezier(.22,.61,.36,1) both; }
    #combo.glitch .combo-card { animation: glitch-frame 360ms cubic-bezier(.22,.61,.36,1) both; }
    /* After the entrance, keep the combo alive with a subtle, continuous shake. */
    #combo.visible:not(.hiding):not(.glitch):not(.milestone-hit) .combo-card { animation: idle-pulse 2.8s ease-in-out infinite; }
    #combo.visible:not(.hiding):not(.glitch).milestone-hit .combo-card { animation: milestone-hit 520ms ease-in-out both; }
    #combo.hiding .combo-card { animation: crumble 1050ms cubic-bezier(.22,.61,.36,1) both; }
    #combo.hiding::before { animation: debris 1050ms ease-out both; }
    #combo::before {
      content: "";
      position: absolute;
      inset: -70px -90px;
      z-index: -1;
      background: radial-gradient(ellipse, color-mix(in srgb, var(--combo-color) 58%, transparent), transparent 68%);
      opacity: 0;
    }
    /* The outgoing message breaks into its own words when a combo expires. */
    #message-burst { position: fixed; inset: 0; z-index: 10; pointer-events: none; overflow: visible; }
    #message-burst.bursting::before { content: ''; position: absolute; inset: 50%; width: 16vw; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--combo-color) 78%, white) 0%, color-mix(in srgb, var(--combo-color) 38%, transparent) 35%, transparent 72%); animation: burst-flash 720ms ease-out both; }
    .message-shard { position: absolute; left: 50%; top: 50%; max-width: 46vw; overflow: hidden; padding: 6px 12px 8px; border: 3px solid rgba(255,255,255,.96); border-radius: 11px; background: color-mix(in srgb, var(--combo-color) 82%, #060914); box-shadow: 0 0 24px var(--combo-color), 5px 6px 0 var(--ink); color: #fff; font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; font-size: clamp(32px, 5vw, 90px); font-style: italic; font-weight: 900; line-height: 1; letter-spacing: .03em; text-align: center; text-overflow: ellipsis; white-space: nowrap; -webkit-text-stroke: 3px var(--ink); text-shadow: 3px 4px 0 var(--ink), 0 0 24px var(--combo-color); animation: message-explode 1250ms cubic-bezier(.08,.74,.2,1) var(--delay) both; }
    .message-shard .emote { height: 1.08em; width: auto; vertical-align: -.17em; filter: drop-shadow(3px 4px 0 var(--ink)) drop-shadow(0 0 12px var(--combo-color)); }
    .theme-fx { position: absolute; inset: -115px -110px; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
    .theme-fx i { position: absolute; display: block; }

    /* Sakura: a soft glass card and drifting cherry-blossom petals. */
    :root[data-theme="sakura"] .theme-fx { opacity: 1; z-index: 2; }
    :root[data-theme="sakura"] .combo-card { border-radius: 48px 10px 48px 10px; clip-path: none; background: linear-gradient(115deg, #fff5fa 0%, #ffd0e5 45%, #f88fbe 100%); border: 4px solid white; border-bottom: 7px solid #d73a83; box-shadow: 0 12px 0 #8d285b, 0 0 30px #ff9acb; }
    :root[data-theme="sakura"] #message { color: #8d2257; -webkit-text-stroke: 3px white; text-shadow: 3px 4px 0 #ffd3e5; }
    :root[data-theme="sakura"] .label { color: white; background: #d73a83; border-color: white; box-shadow: 3px 3px 0 #8d285b; }
    :root[data-theme="sakura"] .message-wrap { border-color: rgba(141,34,87,.2); }
    :root[data-theme="sakura"] .theme-fx .fx-a { width: 30px; height: 21px; top: -14px; left: 7%; border-radius: 90% 10% 90% 10%; background: #ff68ad; transform: rotate(-32deg); box-shadow: 58px 36px #ffc2df, 104px 90px #ff83bd, 155px 19px #ffd2e9, 212px 122px #ff8fc4, 264px 62px #ffc2df; animation: petals 4.5s linear infinite; }
    :root[data-theme="sakura"] .theme-fx .fx-b { width: 23px; height: 31px; top: -55px; left: 26%; border-radius: 90% 10% 90% 10%; background: #ffd4e8; transform: rotate(48deg); box-shadow: -40px 86px #ff85be, 30px 51px #ffc4e0, 82px 142px #ff9dcc, 140px 74px #ffe0ef; animation: petals 5.4s -2.7s linear infinite; }
    .theme-fx .petal { display: none; }
    :root[data-theme="sakura"] .theme-fx .fx-a, :root[data-theme="sakura"] .theme-fx .fx-b { display: none; }
    :root[data-theme="sakura"] .theme-fx .petal { display: block; width: calc(var(--size) * 1.35); height: var(--size); top: -30px; left: var(--x); border-radius: 90% 10% 90% 10%; background: var(--petal-color, #ff9dcc); box-shadow: 0 0 9px rgba(255,255,255,.72); animation: sakura-rain var(--duration) var(--delay) linear infinite; }
    .theme-fx .meteor { display: none; }
    :root[data-theme="luna"] .theme-fx .meteor { display: block; width: calc(var(--length) * 1.55); height: 8px; top: var(--y); left: var(--x); border-radius: 99px; background: linear-gradient(90deg, transparent, #5264ff 20%, #9eaeff 45%, #fff 72%, transparent); box-shadow: 0 0 15px #f1f3ff, 0 0 38px #7789ff, 0 0 64px rgba(102,120,255,.8); animation: meteor-shower var(--duration) var(--delay) linear infinite; }
    .theme-fx .rain-drop { display: none; }
    :root[data-theme="rainfall"] .theme-fx .rain-drop { display: block; width: var(--width, 4px); height: var(--length, 40px); top: var(--y); left: var(--x); border-radius: 99px; background: linear-gradient(to bottom, rgba(234,251,255,0), #c8f3ff 40%, #73bfff 100%); box-shadow: 0 0 7px rgba(145,218,255,.75); transform: rotate(28deg); animation: rain-fall var(--duration) var(--delay) linear infinite; }

    /* Rainfall: a dark storm-glass card with bright diagonal rainfall. */
    :root[data-theme="rainfall"] .theme-fx { opacity: 1; z-index: 3; }
    :root[data-theme="rainfall"] .combo-card { border-radius: 30px; clip-path: none; background: linear-gradient(145deg, #547b9d 0%, #1c385b 45%, #101d38 100%); border: 3px solid #bcecff; border-bottom: 8px solid #071328; box-shadow: 0 13px 0 #050b16, inset 0 1px 0 rgba(255,255,255,.32), 0 0 31px rgba(88,181,255,.52); }
    :root[data-theme="rainfall"] #message { color: #f3fbff; -webkit-text-stroke: 3px #10294b; text-shadow: 3px 4px 0 #071529; }
    :root[data-theme="rainfall"] .label { color: #102c4e; background: #c7efff; border-color: #f5fdff; box-shadow: 3px 3px 0 #0a1b34; }
    :root[data-theme="rainfall"] .message-wrap { border-color: rgba(191,232,255,.28); }
    :root[data-theme="rainfall"] .theme-fx .fx-a { display: none; }
    :root[data-theme="rainfall"] .theme-fx .fx-b { display: none; }

    /* Inferno: a clean ember-lit card surrounded by falling cinders. */
    :root[data-theme="inferno"] .theme-fx { opacity: 1; }
    :root[data-theme="inferno"] .theme-fx { z-index: 2; }
    :root[data-theme="inferno"] .combo-card { border-radius: 30px; clip-path: none; background: radial-gradient(circle at 50% -20%, #ffdd52, #ff6a24 39%, #9f151d 73%, #30080c 100%); border: 3px solid #ffcc42; border-bottom: 9px solid #59100e; box-shadow: 0 13px 0 #260609, 0 0 32px #ff592a; }
    :root[data-theme="inferno"] #message { color: #fff5ca; -webkit-text-stroke: 3px #6e1010; text-shadow: 3px 4px 0 #3a0909; }
    :root[data-theme="inferno"] .label { color: #fff6c4; background: #9e1419; border-color: #ffcd3e; box-shadow: 3px 3px 0 #390707; }
    :root[data-theme="inferno"] .message-wrap { border-color: rgba(255,234,130,.35); }
    :root[data-theme="inferno"] .theme-fx .fx-a, :root[data-theme="inferno"] .theme-fx .fx-b { display: none; }
    .theme-fx .fire-ember { display: none; }
    :root[data-theme="inferno"] .theme-fx .fire-ember { display: block; width: var(--size); height: var(--size); top: var(--y); left: var(--x); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fffde2 0 15%, #ffd650 30%, #ff7029 66%, #b51d0d 100%); box-shadow: 0 0 9px #ffd052, 0 0 22px rgba(255,65,20,.9); animation: ember-fall var(--duration) var(--delay) linear infinite; }
    :root[data-theme="inferno"] .theme-fx .fire-ember::after { content: ''; position: absolute; z-index: -1; width: max(3px, calc(var(--size) * .34)); height: var(--trail, 24px); left: 50%; bottom: calc(100% - 3px); transform: translateX(-50%) rotate(calc(var(--tilt, 0deg) + 48deg)); transform-origin: bottom; border-radius: 99px; background: linear-gradient(to top, rgba(255,112,35,.9), rgba(255,80,20,0)); filter: blur(.4px); }
    .theme-fx .fireball { display: none; }
    :root[data-theme="inferno"] .theme-fx .fireball { display: block; width: var(--size); height: var(--size); top: var(--y); left: var(--x); border-radius: 50%; background: radial-gradient(circle at 34% 30%, #fffde8 0 11%, #ffd34b 20%, #ff7c24 47%, #df2918 72%, #65100c 100%); box-shadow: 0 0 12px #ffe06a, 0 0 27px #ff7a24, 0 0 48px rgba(240,48,16,.8); animation: ember-fall var(--duration) var(--delay) linear infinite; }
    :root[data-theme="inferno"] .theme-fx .fireball::after { content: ''; position: absolute; z-index: -1; width: calc(var(--size) * .42); height: var(--trail); left: 50%; bottom: calc(100% - 3px); transform: translateX(-50%) rotate(48deg); transform-origin: bottom; border-radius: 99px; background: linear-gradient(to top, #ff9b2b, rgba(244,55,19,.55) 40%, transparent); filter: blur(1.4px); }

    :root[data-theme="inferno"] .combo-card { background: radial-gradient(circle at 50% -20%, rgba(255,221,82,.86), rgba(255,106,36,.76) 39%, rgba(159,21,29,.84) 73%, rgba(48,8,12,.9) 100%); }
    :root[data-theme="rainfall"] .theme-fx { z-index: 3; }
    /* Cinders pass in front like a real shower; the card remains legible behind their small gaps. */
    :root[data-theme="inferno"] .theme-fx { z-index: 3; }
    :root[data-theme="inferno"] #combo.theme-burst .fire-ember { filter: brightness(1.35) saturate(1.2); }

    /* Luna: a midnight capsule with a crescent moon and orbiting stars. */
    :root[data-theme="luna"] .theme-fx { opacity: 1; z-index: 2; }
    :root[data-theme="luna"] .combo-card { border-radius: 54px; clip-path: none; background: radial-gradient(circle at 17% 20%, #7980be 0%, transparent 28%), radial-gradient(circle at 80% 100%, #553e9c, transparent 42%), #171a4d; border: 3px solid #e4e7ff; border-bottom: 7px solid #7774c5; box-shadow: 0 12px 0 #0a0b28, 0 0 30px #a89cff; }
    :root[data-theme="luna"] #message { color: #f4f4ff; -webkit-text-stroke: 3px #26265f; text-shadow: 3px 4px 0 #101035; }
    :root[data-theme="luna"] .label { color: #24255e; background: #e9ebff; border-color: #aaa9ef; box-shadow: 3px 3px 0 #12123c; }
    :root[data-theme="luna"] .message-wrap { border-color: rgba(225,228,255,.25); }
    :root[data-theme="luna"] .theme-fx .fx-a { width: 90px; height: 90px; top: -8px; left: 6%; border-radius: 50%; background: #eef0ff; box-shadow: inset -24px -5px 0 #55518c, 175px 15px 0 -42px #fff, 255px 60px 0 -43px #d8ddff, 410px -5px 0 -44px #fff, 526px 50px 0 -43px #d8ddff; filter: drop-shadow(0 0 16px #b8bfff); }
    :root[data-theme="luna"] .theme-fx .fx-b { width: 5px; height: 5px; top: 34px; right: 12%; border-radius: 50%; background: white; box-shadow: -65px 40px #c5c8ff, -150px -22px #fff, -245px 52px #b8c7ff, -335px -10px #fff; animation: twinkle 1.6s ease-in-out infinite alternate; }

    /* Blizzard: an icy frame beneath a dense, gently windblown snowfall. */
    :root[data-theme="blizzard"] .theme-fx { opacity: 1; z-index: 3; }
    :root[data-theme="blizzard"] .combo-card { overflow: hidden; border-radius: 34px; clip-path: none; background: radial-gradient(circle at 18% 0%, rgba(255,255,255,.66), transparent 27%), linear-gradient(128deg, rgba(210,245,255,.54) 0%, rgba(66,152,196,.48) 44%, rgba(10,54,88,.7) 100%); border: 2px solid rgba(242,253,255,.84); border-bottom: 7px solid rgba(101,190,230,.6); box-shadow: 0 13px 0 rgba(5,34,57,.54), inset 0 2px 0 rgba(255,255,255,.62), inset 0 -18px 30px rgba(2,35,58,.24), 0 0 34px rgba(162,226,255,.72); backdrop-filter: blur(14px) saturate(1.25); }
    :root[data-theme="blizzard"] .combo-card::after { width: 53%; height: 42%; right: -9%; top: -15%; transform: rotate(18deg); background: linear-gradient(100deg, transparent, rgba(255,255,255,.62), transparent); box-shadow: none; opacity: .72; }
    :root[data-theme="blizzard"] .combo-card::before { opacity: .22; background: linear-gradient(120deg, transparent 0 20%, rgba(255,255,255,.46) 28% 31%, transparent 38% 62%, rgba(210,246,255,.4) 69% 72%, transparent 80%); }
    :root[data-theme="blizzard"] #message { color: #f9feff; -webkit-text-stroke: 3px #0a3c60; text-shadow: 3px 4px 0 rgba(5,38,63,.78), 0 0 14px rgba(235,252,255,.42); }
    :root[data-theme="blizzard"] .label { color: #0c4268; background: rgba(238,251,255,.7); border-color: rgba(255,255,255,.88); box-shadow: 3px 3px 0 rgba(23,82,115,.62); backdrop-filter: blur(8px); }
    :root[data-theme="blizzard"] .message-wrap { border-color: rgba(232,250,255,.38); background: rgba(3,46,75,.1); }
    :root[data-theme="blizzard"] .theme-fx .fx-a, :root[data-theme="blizzard"] .theme-fx .fx-b { display: none; }
    .theme-fx .snowflake { display: none; }
    :root[data-theme="blizzard"] .theme-fx .snowflake { display: block; top: var(--y); left: var(--x); color: var(--snow-color, #fff); font-family: Georgia, serif; font-size: var(--size); line-height: 1; text-shadow: 0 0 7px rgba(211,245,255,.95), 0 0 18px rgba(125,207,255,.72); animation: snow-fall var(--duration) var(--delay) linear infinite; }
    :root[data-theme="blizzard"] .theme-fx .snowflake::before { content: '❄'; }

    /* A saved Control Room palette keeps each theme's motion while recoloring
       the card, label, and text as one cohesive glass treatment. */
    :root.custom-palette .combo-card { background: linear-gradient(128deg, color-mix(in srgb, var(--user-accent) 42%, transparent), color-mix(in srgb, var(--user-panel) 78%, transparent)) !important; border-color: var(--user-edge, var(--panel-edge)) !important; border-bottom-color: color-mix(in srgb, var(--user-accent) 60%, var(--user-panel)) !important; box-shadow: 0 13px 0 color-mix(in srgb, var(--user-panel) 68%, #000), inset 0 2px 0 color-mix(in srgb, var(--user-edge) 45%, transparent), inset 0 -18px 30px color-mix(in srgb, var(--user-panel) 48%, #000), 0 0 34px color-mix(in srgb, var(--user-accent) 62%, transparent) !important; }
    :root.custom-palette .combo-card::after { background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--user-edge) 70%, transparent), transparent) !important; box-shadow: none !important; }
    :root.custom-palette #message { color: var(--user-edge, #fff) !important; -webkit-text-stroke-color: var(--user-ink, var(--ink)) !important; text-shadow: 3px 4px 0 var(--user-ink, var(--ink)), 0 0 14px color-mix(in srgb, var(--user-accent) 45%, transparent) !important; }
    :root.custom-palette .label { color: var(--user-ink, var(--ink)) !important; background: color-mix(in srgb, var(--user-edge) 72%, var(--user-panel)) !important; border-color: var(--user-edge, #fff) !important; box-shadow: 3px 3px 0 color-mix(in srgb, var(--user-panel) 72%, #000) !important; }
    :root.custom-palette .message-wrap { border-color: color-mix(in srgb, var(--user-edge) 32%, transparent) !important; background: color-mix(in srgb, var(--user-panel) 20%, transparent) !important; }


    @keyframes petals { 0% { transform: translate(0,0) rotate(-32deg); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(-70px,190px) rotate(130deg); opacity: 0; } }
    @keyframes sakura-rain { 0% { opacity: 0; transform: translate(0, 0) rotate(0deg); } 7% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--drift), 410px) rotate(var(--spin)); } }
    @keyframes meteor-shower { 0%, 5% { opacity: 0; transform: translate(0, 0) rotate(145deg); } 10% { opacity: 1; } 38% { opacity: 1; } 55%, 100% { opacity: 0; transform: translate(-420px, 280px) rotate(145deg); } }
    @keyframes rain-fall { 0%, 5% { opacity: 0; transform: translate(0, 0) rotate(28deg) scaleY(.7); } 10% { opacity: .92; } 45% { opacity: .82; } 58%, 100% { opacity: 0; transform: translate(-420px, 280px) rotate(28deg) scaleY(1); } }
    @keyframes foam-bob { to { transform: translate(4px,-6px) scale(1.08); opacity: 1; } }
    @keyframes splash-pop { 0% { opacity: 0; transform: translate(0,0) scale(.3); } 22% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--drift-x), var(--drift-y)) scale(.8); } }
    @keyframes flame-idle-a { to { transform: translateY(-3px) scaleX(.99) skewX(-1deg); opacity: .94; } }
    @keyframes flame-idle-b { to { transform: translateY(-6px) scaleX(1.025) skewX(1.5deg); filter: brightness(1.08); } }
    @keyframes flame-idle-c { to { transform: translateY(-8px) scaleX(.94) skewX(-2deg); filter: brightness(1.17); } }
    @keyframes flame-flare { 0% { transform: translateX(-50%) scale(1); } 42% { transform: translateX(-50%) translateY(-30px) scale(1.18,1.34); } 100% { transform: translateX(-50%) scale(1); } }
    @keyframes ember-rise { 0% { opacity: 0; transform: translate(0,8px) scale(.35); } 18% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--drift-x), var(--drift-y)) scale(.1); } }
    /* Match Luna's sweeping shower path, with sparks instead of cool meteor trails. */
    @keyframes ember-fall { 0%, 5% { opacity: 0; transform: translate(0, 0) scale(.55); } 10% { opacity: 1; } 38% { opacity: .9; } 55%, 100% { opacity: 0; transform: translate(-420px, 280px) scale(.3); } }
    @keyframes lunar { 50% { transform: translateY(-7px); filter: drop-shadow(0 0 26px #d5d9ff); } }
    @keyframes twinkle { to { transform: scale(2.2); opacity: .35; } }
    @keyframes snow-fall { 0%, 4% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.6); } 10% { opacity: .95; } 82% { opacity: .82; } 100% { opacity: 0; transform: translate(var(--drift), 415px) rotate(260deg) scale(1.12); } }

    /* Theme-specific exits: each one replaces the generic crumble. */
    :root[data-theme="sakura"] #combo.hiding { animation: sakura-exit 1050ms cubic-bezier(.22,.61,.36,1) both; }
    :root[data-theme="sakura"] #combo.hiding .combo-card { animation: sakura-card-exit 1050ms cubic-bezier(.22,.61,.36,1) both; }
    :root[data-theme="sakura"] #combo.hiding .theme-fx { animation: petal-exit 1050ms cubic-bezier(.22,.61,.36,1) both; }
    :root[data-theme="sakura"] #combo.hiding::before, :root[data-theme="sakura"] #combo.hiding .combo-card::before { animation: none; opacity: 0; }

    :root[data-theme="rainfall"] #combo.hiding { animation: tsunami-exit 1050ms cubic-bezier(.22,.61,.36,1) both; }
    :root[data-theme="rainfall"] #combo.hiding .combo-card { animation: tsunami-card-exit 1050ms cubic-bezier(.22,.61,.36,1) both; }
    :root[data-theme="rainfall"] #combo.hiding .theme-fx { animation: wave-exit 1050ms cubic-bezier(.22,.61,.36,1) both; }
    :root[data-theme="rainfall"] #combo.hiding::before, :root[data-theme="rainfall"] #combo.hiding .combo-card::before { animation: none; opacity: 0; }

    :root[data-theme="inferno"] #combo.hiding { animation: inferno-exit 1050ms cubic-bezier(.22,.61,.36,1) both; }
    :root[data-theme="inferno"] #combo.hiding .combo-card { animation: inferno-card-exit 1050ms cubic-bezier(.22,.61,.36,1) both; }
    :root[data-theme="inferno"] #combo.hiding .theme-fx { animation: flame-exit 1050ms cubic-bezier(.22,.61,.36,1) both; }

    .combo-card {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      min-width: min(560px, 82vw);
      padding: 15px clamp(28px, 4vw, 58px) 15px;
      background:
        repeating-linear-gradient(135deg, transparent 0 15px, rgba(255,255,255,.035) 15px 16px),
        linear-gradient(90deg, var(--combo-color) 0 8px, transparent 8px),
        linear-gradient(135deg, rgba(255,255,255,.13), transparent 33%),
        var(--panel);
      border: 2px solid var(--panel-edge);
      border-bottom: 4px solid var(--combo-color);
      clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
      box-shadow: inset 0 1px rgba(255,255,255,.22), inset 0 -18px 30px rgba(0,0,0,.24), 0 0 22px color-mix(in srgb, var(--combo-color) 28%, transparent);
      backdrop-filter: blur(7px);
      will-change: transform, opacity, filter;
    }
    .combo-card::after {
      content: "";
      position: absolute;
      right: 21px;
      top: 18px;
      width: 36px;
      height: 3px;
      background: var(--combo-color);
      box-shadow: 8px 8px 0 rgba(255,255,255,.25), 16px 16px 0 rgba(255,255,255,.12);
    }
    .combo-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(120deg, transparent 0 19%, var(--combo-color) 20% 24%, transparent 25% 49%, rgba(255,255,255,.75) 50% 53%, transparent 54% 78%, var(--combo-color) 79% 83%, transparent 84%);
    }
    #combo.hiding .combo-card::before { animation: fragments 1050ms ease-out both; }
    .label {
      position: relative;
      z-index: 1;
      justify-self: start;
      /* Align the tag tightly with the frame's left angled edge. */
      margin: -4px auto 13px 7px;
      padding: 9px 18px 8px;
      color: var(--ink);
      background: var(--combo-color);
      border: 2px solid rgba(255,255,255,.78);
      box-shadow: 3px 3px 0 var(--ink);
      font: 900 clamp(20px, 2.1vw, 30px)/1 Arial, sans-serif;
      letter-spacing: .12em;
      clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
    }
    .message-wrap {
      width: 100%;
      min-height: clamp(66px, 8vw, 128px);
      display: grid;
      align-items: center;
      justify-items: center;
      border-top: 1px solid rgba(255,255,255,.12);
      border-bottom: 1px solid rgba(255,255,255,.09);
    }
    #message {
      max-width: 100%;
      overflow-wrap: anywhere;
      text-align: center;
      color: #fff;
      font: 900 var(--message-size)/.92 var(--font);
      letter-spacing: .015em;
      text-transform: uppercase;
      -webkit-text-stroke: 4px var(--ink);
      paint-order: stroke fill;
      text-shadow: 3px 4px 0 rgba(0, 0, 0, .8), 0 0 14px color-mix(in srgb, var(--combo-color) 30%, transparent);
    }
    #message .emote {
      height: 1.18em;
      width: auto;
      max-width: 3.4em;
      vertical-align: -.12em;
      object-fit: contain;
      /* Emotes keep the same sharp outlined, arcade-style treatment. */
      filter: drop-shadow(3px 3px 0 var(--ink)) drop-shadow(0 0 8px rgba(255,255,255,.18));
    }
    #count {
      position: absolute;
      z-index: 3;
      top: -49px;
      right: -32px;
      margin: 0;
      padding: 8px 17px 9px;
      color: var(--count-color);
      background: var(--ink);

      will-change: transform, filter;

    #count.count-pop { animation: count-pop 390ms cubic-bezier(.18,.82,.25,1.18) both; }
    .milestone #count { color: var(--count-color); box-shadow: 0 4px 0 var(--count-color), 0 0 22px color-mix(in srgb, var(--count-color) 65%, transparent); }

      <i class="fire-ember" style="--x:35%;--y:-19px;--size:11px;--trail:31px;--tilt:-6deg;--duration:4.7s;--delay:-.8s;--drift:18px"></i>
      <i class="fire-ember" style="--x:43%;--y:61px;--size:7px;--trail:19px;--tilt:4deg;--duration:3.7s;--delay:-3.1s;--drift:-14px"></i>
      <i class="fire-ember" style="--x:51%;--y:-42px;--size:14px;--trail:39px;--tilt:-9deg;--duration:4.3s;--delay:-2.1s;--drift:32px"></i>
      <i class="fire-ember" style="--x:59%;--y:20px;--size:9px;--trail:26px;--tilt:7deg;--duration:3.9s;--delay:-.2s;--drift:-25px"></i>
      <i class="fire-ember" style="--x:67%;--y:-9px;--size:16px;--trail:44px;--tilt:-5deg;--duration:4.8s;--delay:-3.4s;--drift:23px"></i>
      <i class="fire-ember" style="--x:75%;--y:48px;--size:8px;--trail:23px;--tilt:8deg;--duration:3.6s;--delay:-1.1s;--drift:-34px"></i>
      <i class="fire-ember" style="--x:84%;--y:-29px;--size:13px;--trail:36px;--tilt:-7deg;--duration:4.4s;--delay:-2.6s;--drift:16px"></i>
      <i class="fire-ember" style="--x:93%;--y:71px;--size:7px;--trail:20px;--tilt:6deg;--duration:3.4s;--delay:-.6s;--drift:-18px"></i>
      <i class="fire-ember" style="--x:7%;--y:112px;--size:9px;--trail:26px;--tilt:5deg;--duration:4.6s;--delay:-3.7s;--drift:24px"></i>
      <i class="fire-ember" style="--x:47%;--y:104px;--size:12px;--trail:33px;--tilt:-7deg;--duration:3.9s;--delay:-1.9s;--drift:-28px"></i>
      <i class="fire-ember" style="--x:78%;--y:119px;--size:10px;--trail:28px;--tilt:9deg;--duration:4.2s;--delay:-.7s;--drift:30px"></i>
      <!-- A few clean comet-like fireballs share the same diagonal path. -->
      <i class="fireball" style="--x:86%;--y:-42px;--size:21px;--trail:72px;--duration:6.2s;--delay:-1.6s"></i>
      <i class="fireball" style="--x:105%;--y:76px;--size:17px;--trail:58px;--duration:7s;--delay:-4.7s"></i>
    </div>
    <section class="combo-card">
      <div class="label">CHAT COMBO</div>
      <div class="message-wrap"><div id="message"></div></div>
    </section>
    <div id="count"></div>
  </main>
  <div id="message-burst" aria-hidden="true"></div>
  <script>
    // These must match the backend's defaults unless you add settings via URL.
    const options = new URLSearchParams(location.search);
    const timeoutMs = Number(options.get('timeout')) || 6500;
    const combo = document.querySelector('#combo');
    const message = document.querySelector('#message');
    const count = document.querySelector('#count');
    const messageBurst = document.querySelector('#message-burst');
    let hideTimer;
    let glitchTimer;
    let milestoneTimer;
    let themeBurstTimer;
    let lastMessage = '';
    const validThemes = new Set(['game', 'sakura', 'rainfall', 'inferno', 'luna', 'blizzard']);
    const colorRamps = {
      game: ['#45f28c', '#27dcff', '#b46cff', '#ff8c2a', '#ff3159'],
      sakura: ['#ffaad5', '#ff76b7', '#d978ff', '#ff8c8c', '#ff3d80'],
      rainfall: ['#c8f3ff', '#92d9ff', '#568cff', '#546bce', '#a785ff'],
      inferno: ['#ffe04d', '#ffb32c', '#ff792e', '#ff4c32', '#ff244e'],
      luna: ['#d9dcff', '#91c9ff', '#a58bff', '#d977ff', '#ff70bd'],
      blizzard: ['#e9f9ff', '#a7e5ff', '#6abcf2', '#7d9dff', '#e2c7ff']
    };
    let currentTheme = 'game';

    function applyTheme(theme, themePalettes = {}) {
      currentTheme = validThemes.has(theme) ? theme : 'game';
      document.documentElement.dataset.theme = currentTheme;
      const palette = themePalettes[currentTheme];
      document.documentElement.classList.toggle('custom-palette', Boolean(palette && Object.keys(palette).length));
      ['accent', 'hotAccent', 'panel', 'edge', 'ink'].forEach(key => {
        document.documentElement.style.removeProperty(`--user-${key.replace(/[A-Z]/g, letter => `-${letter.toLowerCase()}`)}`);
      });
      if (palette) {
        Object.entries(palette).forEach(([key, color]) => {
          document.documentElement.style.setProperty(`--user-${key.replace(/[A-Z]/g, letter => `-${letter.toLowerCase()}`)}`, color);
        });
      }
      combo.style.setProperty('--combo-color', colorRamps[currentTheme][0]);
      combo.style.setProperty('--count-color', colorRamps[currentTheme][0]);
    }

    function renderMessage(text, emotes = {}, thirdPartyEmotes = []) {
      // Twitch's emote ranges use JavaScript string offsets (inclusive end).
      // Build DOM nodes rather than injecting chat content as HTML.
      const ranges = [
        ...Object.entries(emotes).flatMap(([id, positions]) =>
          positions.map(position => {
          const [start, end] = position.split('-').map(Number);
            return { id, start, end };
          })
        ),
        ...thirdPartyEmotes
      ].sort((a, b) => a.start - b.start);

      message.replaceChildren();
      let cursor = 0;
      for (const range of ranges) {
        if (range.start < cursor || range.end < range.start) continue;
        message.append(document.createTextNode(text.slice(cursor, range.start)));
        const image = new Image();
        image.className = 'emote';
        image.alt = text.slice(range.start, range.end + 1);
        image.src = range.url || `https://static-cdn.jtvnw.net/emoticons/v2/${range.id}/default/dark/3.0`;
        message.append(image);
        cursor = range.end + 1;
      }
      message.append(document.createTextNode(text.slice(cursor)));
    }

    function intensityFor(value) {
      // Add or edit milestones to tune size, hot color, and screen shake.
      const colors = colorRamps[currentTheme];
      if (value >= 50) return { power: 1.35, milestone: true, shake: true, color: colors[4] };
      if (value >= 25) return { power: 1.22, milestone: true, shake: true, color: colors[3] };
      if (value >= 10) return { power: 1.12, milestone: true, shake: true, color: colors[2] };
      if (value >= 5) return { power: 1.04, milestone: true, shake: true, color: colors[1] };
      return { power: 1, milestone: false, shake: false, color: colors[0] };
    }

    function showCombo(event) {
      const wasVisible = combo.classList.contains('visible') && !combo.classList.contains('hiding');
      const intensity = intensityFor(event.count);
      renderMessage(event.message, event.emotes, event.thirdPartyEmotes);
      lastMessage = event.message;
      messageBurst.replaceChildren();
      messageBurst.classList.remove('bursting');
      count.textContent = `x${event.count}`;
      count.classList.remove('count-pop');
      void count.offsetWidth; // replay the count punch on every new repeat
      count.classList.add('count-pop');
      combo.style.setProperty('--power', intensity.power);
      combo.style.setProperty('--combo-color', intensity.color);
      combo.style.setProperty('--count-color', intensity.color);
      combo.classList.toggle('milestone', intensity.milestone);
      if ([5, 10, 25, 50].includes(event.count)) {
        // Only milestones flare the theme art; ordinary increments leave its
        // continuous idle loop completely uninterrupted.
        combo.classList.remove('theme-burst');
        void combo.offsetWidth;
        combo.classList.add('theme-burst');
        clearTimeout(themeBurstTimer);
        themeBurstTimer = setTimeout(() => combo.classList.remove('theme-burst'), 720);
        combo.classList.remove('milestone-hit');
        void combo.offsetWidth;
        combo.classList.add('milestone-hit');
        clearTimeout(milestoneTimer);
        milestoneTimer = setTimeout(() => combo.classList.remove('milestone-hit'), 450);
      }
      // An active combo keeps its existing animation/state. New repeats only
      // update the displayed count and extend its lifetime.
      if (!wasVisible) {
        combo.classList.remove('hiding', 'glitch', 'slam', 'shake');
        void combo.offsetWidth;
        combo.classList.add('visible');
        combo.classList.add('glitch', 'slam');
        if (intensity.shake) combo.classList.add('shake');
        clearTimeout(glitchTimer);
        glitchTimer = setTimeout(() => combo.classList.remove('glitch'), 350);
      }

      clearTimeout(hideTimer);
      // Use the server's real setting so the display always expires in sync.
      hideTimer = setTimeout(hideCombo, event.timeoutMs || timeoutMs);
    }

    function explodeMessage() {
      const text = lastMessage.trim();
      if (!text) return;
      const directions = [
        [-340, -195, -30], [-160, -285, -18], [54, -300, 10],
        [265, -205, 27], [365, -52, 38], [-385, -40, -34],
        [-300, 175, -25], [-105, 285, -12], [115, 290, 15],
        [315, 170, 31], [-30, -115, -5], [188, -78, 19],
        [-420, 82, -42], [430, 95, 44], [-12, 350, -4], [18, -365, 5]
      ];
      messageBurst.replaceChildren();
      messageBurst.classList.add('bursting');
      directions.forEach(([x, y, rotation], index) => {
        const shard = document.createElement('span');
        shard.className = 'message-shard';
        // Clone the already-rendered message so emotes burst as images too.
        shard.append(...[...message.childNodes].map((node) => node.cloneNode(true)));
        shard.style.setProperty('--burst-x', `${x}px`);
        shard.style.setProperty('--burst-y', `${y}px`);
        shard.style.setProperty('--burst-rotate', `${rotation}deg`);
        shard.style.setProperty('--delay', `${index * 14}ms`);
        messageBurst.append(shard);
      });
    }

    function hideCombo() {
      // The slam animation uses a filled final frame, so it must be removed
      // before the exit animation or its opacity would remain pinned at 1.
      clearTimeout(hideTimer);
      explodeMessage();
      combo.classList.remove('visible', 'glitch', 'slam', 'shake', 'milestone-hit', 'theme-burst');
      clearTimeout(glitchTimer);
      clearTimeout(milestoneTimer);
      clearTimeout(themeBurstTimer);
      combo.classList.add('hiding');
      setTimeout(() => { combo.classList.remove('hiding'); messageBurst.replaceChildren(); messageBurst.classList.remove('bursting'); }, 1500);
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const socket = new WebSocket(`${protocol}//${location.host}/ws`);
      socket.addEventListener('message', ({ data }) => {
        const event = JSON.parse(data);
        if (event.type === 'combo') showCombo(event);
        if (event.type === 'settings') applyTheme(event.settings.theme, event.settings.themePalettes);
      });
      socket.addEventListener('close', () => setTimeout(connect, 2000));
      socket.addEventListener('error', () => socket.close());
    }
    connect();
    fetch('/api/settings').then(response => response.json()).then(settings => applyTheme(settings.theme, settings.themePalettes)).catch(() => {});

    // Add ?preview=1 to the browser-source URL to verify the visual design
    // without sending chat messages. Remove it when you are ready to go live.
    if (options.get('preview') === '1') {
      let previewCount = 2;
      const preview = () => {
        const isFinalPreview = previewCount === 15;
        // Preview plays one uninterrupted combo, pauses at x15, then runs one
        // real exit so the message explosion can be inspected too.
        showCombo({ message: 'GG', count: previewCount++, emotes: {}, timeoutMs: isFinalPreview ? 60000 : 7000 });
        if (isFinalPreview) setTimeout(hideCombo, 2600);
        else setTimeout(preview, 1200);
      };
      preview();
    }
  </script>
</body>
