<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combo Overlay Control Room</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0d17; --panel: #151827; --muted: #9298b4; --text: #f7f8ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 80% 0, #24336a 0, transparent 36%), var(--bg); color: var(--text); font: 16px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(1000px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0; }
    .eyebrow { color: #55ddff; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 7px 0 9px; font-size: clamp(34px, 6vw, 62px); letter-spacing: -.055em; line-height: .95; }
    .lead { max-width: 620px; margin: 0; color: var(--muted); }
    h2 { margin: 54px 0 16px; font-size: 18px; }
    .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 14px; }
    .theme { min-height: 160px; padding: 18px; border: 2px solid transparent; border-radius: 18px; color: inherit; text-align: left; cursor: pointer; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
    .theme:hover { transform: translateY(-4px); }
    .theme:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .theme.selected { border-color: white; box-shadow: 0 0 0 3px color-mix(in srgb, var(--theme) 35%, transparent), 0 14px 28px rgba(0,0,0,.26); }
    .theme span { display: block; margin-top: 44px; color: rgba(255,255,255,.72); font-size: 13px; }
    .theme strong { font-size: 24px; letter-spacing: -.04em; }
    .game { --theme: #ffd23f; background: linear-gradient(145deg, #30354b, #10111a 65%); border-bottom: 5px solid var(--theme); }
    .sakura { --theme: #ff82bd; background: linear-gradient(145deg, #71355f, #2d112a 65%); border-bottom: 5px solid var(--theme); }
    .rainfall { --theme: #a7eaff; background: linear-gradient(145deg, #6488a5 0%, #213b5d 48%, #0a1428 100%); border-bottom: 5px solid #79c9ff; box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
    .inferno { --theme: #ff8a39; background: radial-gradient(circle at 52% -18%, #a14528 0%, #43161b 50%, #16090d 100%); border-bottom: 5px solid #ff7138; box-shadow: inset 0 1px 0 rgba(255,193,105,.2); }
    .luna { --theme: #d9dcff; background: linear-gradient(145deg, #57528f, #171833 65%); border-bottom: 5px solid var(--theme); }
    .rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding: 22px; border: 1px solid #303650; border-radius: 18px; background: rgba(21,24,39,.72); }
    .rule { display: grid; gap: 9px; }
    .rule-label { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
    output { color: #73e2ff; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: #55ddff; }
    .rule small { color: var(--muted); }
    @media (max-width: 620px) { .rules { grid-template-columns: 1fr; } }
    .footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; margin-top: 46px; padding-top: 24px; border-top: 1px solid #292d40; color: var(--muted); }
    code { padding: 3px 6px; border-radius: 5px; background: #23283b; color: #f5f7ff; }
    #saved { color: #69efab; font-weight: 700; opacity: 0; transition: opacity .2s; }
    #saved.visible { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Twitch Chat Combo</div>
    <h1>Control Room</h1>
    <p class="lead">Choose an overlay mood. Your choice saves locally and updates every connected OBS browser source instantly.</p>

    <h2>Choose your theme</h2>
    <section class="themes" aria-label="Overlay themes">
      <button class="theme game" data-theme="game" aria-pressed="false"><strong>Game</strong><span>Arcade gold · the original</span></button>
      <button class="theme sakura" data-theme="sakura" aria-pressed="false"><strong>Sakura</strong><span>Falling petals · glass frame</span></button>
      <button class="theme rainfall" data-theme="rainfall" aria-pressed="false"><strong>Rainfall</strong><span>Diagonal rain · storm-glass frame</span></button>
      <button class="theme inferno" data-theme="inferno" aria-pressed="false"><strong>Inferno</strong><span>Fire comets · ember-lit frame</span></button>
      <button class="theme luna" data-theme="luna" aria-pressed="false"><strong>Luna</strong><span>Crescent moon · orbiting stars</span></button>
    </section>

    <h2>Combo behavior</h2>
    <section class="rules" aria-label="Combo behavior settings">
      <label class="rule" for="combo-timeout">
        <span class="rule-label">Combo timeout <output id="timeout-value">6.5 seconds</output></span>
        <input id="combo-timeout" type="range" min="1000" max="60000" step="500" value="6500">
        <small>How long chat has to repeat the same message before its combo ends.</small>
      </label>
      <label class="rule" for="minimum-count">
        <span class="rule-label">Show starting at <output id="minimum-value">x2</output></span>
        <input id="minimum-count" type="range" min="2" max="50" step="1" value="2">
        <small>Messages below this repeat count stay hidden from the overlay.</small>
      </label>
    </section>

    <div class="footer">
      <span id="saved" role="status">Theme saved — OBS updated.</span>
      <span>OBS URL: <code>/overlay.html</code> · Preview: <code>?preview=1</code></span>
    </div>
  </main>
  <script>
    const cards = [...document.querySelectorAll('.theme')];
    const saved = document.querySelector('#saved');
    const timeout = document.querySelector('#combo-timeout');
    const minimum = document.querySelector('#minimum-count');
    const timeoutValue = document.querySelector('#timeout-value');
    const minimumValue = document.querySelector('#minimum-value');
    let currentSettings = { theme: 'game', comboTimeoutMs: 6500, minComboCount: 2 };

    function select(theme) {
      cards.forEach(card => {
        const selected = card.dataset.theme === theme;
        card.classList.toggle('selected', selected);
        card.setAttribute('aria-pressed', String(selected));
      });
    }
    function render(settings) {
      currentSettings = settings;
      select(settings.theme);
      timeout.value = settings.comboTimeoutMs;
      minimum.value = settings.minComboCount;
      timeoutValue.value = `${(settings.comboTimeoutMs / 1000).toFixed(settings.comboTimeoutMs % 1000 ? 1 : 0)} seconds`;
      minimumValue.value = `x${settings.minComboCount}`;
    }
    async function save(next) {
      const response = await fetch('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(next) });
      if (!response.ok) throw new Error('Could not save settings');
      render(await response.json());
      saved.classList.add('visible');
      setTimeout(() => saved.classList.remove('visible'), 2200);
    }
    cards.forEach(card => card.addEventListener('click', () => save({ ...currentSettings, theme: card.dataset.theme }).catch(error => alert(error.message))));
    timeout.addEventListener('input', () => timeoutValue.value = `${(timeout.value / 1000).toFixed(timeout.value % 1000 ? 1 : 0)} seconds`);
    minimum.addEventListener('input', () => minimumValue.value = `x${minimum.value}`);
    timeout.addEventListener('change', () => save({ ...currentSettings, comboTimeoutMs: Number(timeout.value) }).catch(error => alert(error.message)));
    minimum.addEventListener('change', () => save({ ...currentSettings, minComboCount: Number(minimum.value) }).catch(error => alert(error.message)));
    fetch('/api/settings').then(response => response.json()).then(render).catch(() => render(currentSettings));
  </script>
</body>
</html>
